[project]
name = "warranty-review"
version = "0.1.1"
description = "A warranty claim review workflow: rules baseline, scoped context, human review in a terminal, durable resume."
requires-python = ">=3.12"
dependencies = [
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
